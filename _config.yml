name: APIs.io Deprecation
description: "How much notice each provider promises before retiring an API, how long old versions stay supported, and how it tells you, quoted from their own pages."
image: https://apis.io/assets/branding/apisio-social-card.png
url: https://apis.io
node: website
nav_active: deprecation

keywords:
  - APIs
  - Search
  - Discovery
  - Deprecation
  - RFC 8594 Sunset
  - RFC 9745 Deprecation

exclude: [".rvmrc", ".rbenv-version", "README.md", "Rakefile", "changelog.md", "scripts"]
include: [".well-known"]

github_org: api-search
github_repo: deprecation

collections:
  deprecation:
    output: true
    permalink: /deprecation/:path/

defaults:
  - scope:
      path: ""
      type: deprecation
    values:
      layout: deprecation
